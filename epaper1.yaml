# Board: Seeed XIAO ESP32S3 (Seeed Studio)
# Definition: definitions/boards/seeed-xiao-esp32s3/manifest.yaml
# | ePaper Pin   | NameSPI FunctionRecommended XIAO ESP32-S3 Pin
# |--------------|----------------------------|--------------------
# | VCC Power    | (3.3V)                     | 3V3
# | GND          | Ground                     | GND
# | SDA          | MOSI (Master Out Slave In) | D10 (GPIO10 / Hardware MOSI)
# | SCL          | SCLK (Clock)               | D8 (GPIO8 / Hardware SCK)
# | CS           | Chip Select                | D7 (GPIO44) or any free GPIO
# | D/C (or DC)  | Data / Command Control     | D3 (GPIO3) or any free GPIO
# | RES (or RST) | Reset                      | D2 (GPIO2) or any free GPIO
# | BUSY         | Busy Status Output         | D1 (GPIO1) or any free GPIO
esphome:
  name: epaper1
  friendly_name: epaper1
  on_boot:
    priority: -100
    then:
      - component.update: disp

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "lfqgHwibX9saQIM3+2f4I2R7jIwEFZVdiDlBr0iON2k="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: epaper1 Fallback Hotspot
    password: "g1Ge1C00WIDc"

captive_portal:

spi:
  - id: spi_1
    clk_pin: GPIO8
    miso_pin: 37
    mosi_pin: GPIO10

display:
  - platform: epaper_spi
    id: disp
    model: WEACT-4.2IN-3C
    dc_pin: GPIO3
    dimensions:
      height: 240
      width: 416

    reset_pin: GPIO2
    auto_clear_enabled: false
    update_interval: never
    cs_pin: GPIO44
    busy_pin: GPIO1
    lambda: |-
      it.print(10, 10, id(my_font), "test");

font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 32